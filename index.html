<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#061d26" />
  <title>ワカメ斬り</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="ワカメ斬りゲーム"></canvas>
    <section id="hud" aria-live="polite">
      <div><span class="label">SCORE</span><strong id="score">0</strong></div>
      <div class="combo"><strong id="combo"></strong></div>
      <div><span class="label">DISTANCE</span><strong><span id="distance">0</span>m</strong></div>
    </section>
    <section id="start-panel" class="panel">
      <p class="eyebrow">海中脱出アクション</p>
      <h1>ワカメ斬り</h1>
      <p>左右に勢いよくフリック！<br />からみつくワカメをまとめて斬れ。</p>
      <div class="gesture"><span>←</span><i></i><span>→</span></div>
      <button id="start-button">脱出開始</button>
    </section>
    <section id="result-panel" class="panel hidden">
      <p class="eyebrow">脱出失敗…</p>
      <h2><span id="result-score">0</span>点</h2>
      <p id="result-copy"></p>
      <button id="retry-button">もう一度</button>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
