<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#061d26" />
  <title>ワカメ脱出</title>
  <link rel="stylesheet" href="style.css?v=20260905-2" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="ワカメ脱出ゲーム"></canvas>
    <section id="hud" aria-live="polite">
      <div><span class="label">ねじれ</span><strong id="score">0%</strong></div>
      <div class="combo"><strong id="combo"></strong></div>
      <div><span class="label">摩擦熱</span><strong><span id="distance">0</span>%</strong></div>
    </section>
    <button id="sound-button" aria-label="音を消す">🔊</button>
    <section id="start-panel" class="panel">
      <p class="eyebrow">じたばた脱出アクション</p>
      <h1>ワカメ脱出</h1>
      <p>5人を触って左右へフリック！<br />ワカメをぶつけ、ねじって、弱らせろ。</p>
      <div class="gesture"><span>←</span><i></i><span>→</span></div>
      <button id="start-button">じたばた開始</button>
    </section>
    <section id="result-panel" class="panel hidden">
      <p class="eyebrow">脱出成功！</p>
      <h2><span id="result-score">0.0</span>秒</h2>
      <p id="result-copy"></p>
      <button id="retry-button">もう一度</button>
    </section>
  </main>
  <script src="game.js?v=20260905-14"></script>
</body>
</html>
