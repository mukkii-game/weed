<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#061d26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="コンブゲーム" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>コンブゲーム</title>
  <link rel="stylesheet" href="style.css?v=20260906-18" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="コンブゲーム"></canvas>
    <section id="hud" class="hidden">
      <div><span class="label">コンブのHP</span><strong id="score">100%</strong><span class="damage-track"><i id="damage-fill"></i></span></div>
      <div class="combo"><strong id="combo"></strong></div>
      <div id="countdown"><span class="label">人魚が来るまで</span><strong><span id="distance">30</span><small>秒</small></strong></div>
      <div class="timer"><i id="timer-fill"></i></div>
      <p id="play-hint">タップでくるるっ · 引っぱって、はなす！</p>
    </section>
    <button id="sound-button" aria-label="音を消す">🔊</button>
    <section id="start-panel" class="panel">
      <div class="title-top"><h1>ちいふぐ</h1><p class="subtitle">コンブからの脱出</p></div>
      <div class="title-bottom"><p class="intro">タップやフリックで暴れまわって逃げ出すんだ！</p><button id="start-button">暴れて脱出！</button>
      <p class="mini">BGM:魔王魂　SE:効果音ラボ</p></div>
    </section>
    <section id="result-panel" class="panel hidden">
      <h2><span id="result-score">0.0</span><small id="result-unit">秒</small></h2>
      <p id="best-score"></p>
      <button id="retry-button">もうひと暴れ！</button>
    </section>
  </main>
  <script src="game.js?v=20260906-17"></script>
</body>
</html>
